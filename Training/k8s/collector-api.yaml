apiVersion: v1
kind: Namespace
metadata:
  name: collector
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector-api-deployment
  namespace: collector
  labels:
    app.kubernetes.io/name: collector-api
    app.kubernetes.io/part-of: collector-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: collector-api
  template:
    metadata:
      labels:
        app: collector-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: collector-api
          image: collector-api:1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: collector-api-service
  namespace: collector
spec:
  type: NodePort
  selector:
    app: collector-api
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080
